name: ci

# Pull requests only meant nothing on this fork's own branch ever ran: the work
# happens on master-gomaja, and a push there triggered no job at all.
on:
  push:
  pull_request:

jobs:
  # The suite needs a real SCTP stack and a configured host. Running plain
  # `go test` without that setup is not a smaller version of this job — the AUTH
  # tests skip, and the blackhole-dependent dial tests fail outright, so the
  # result says nothing either way.
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23', '1.24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      # The runner is already Linux with SCTP available, so it needs the setup
      # rather than a container — but it must be testdata/run-tests.sh doing it
      # rather than an inline copy. Inlining the four steps and then calling
      # `go test` directly is what a first attempt at this did, and it silently
      # dropped the script's second pass: the two tests asserting the
      # AUTH-disabled contract skip while net.sctp.auth_enable is on, and only
      # that pass runs them with it off. An inline copy also drifts.
      - name: Prepare the SCTP stack
        run: sudo modprobe sctp && test -e /proc/net/sctp/snmp

      - run: sudo -E env "PATH=$PATH" bash testdata/run-tests.sh ./... -count=1 -timeout 900s
      - run: sudo -E env "PATH=$PATH" bash testdata/run-tests.sh ./... -count=1 -race -timeout 900s

  # The suite only ever runs on one platform at a time, so nothing in it notices
  # a non-portable symbol landing in a file with no build tag. TestCrossCompiles
  # covers the build; vet is separate because it type-checks _test.go files,
  # which `go build` does not, and that is where the 32-bit breakage was.
  vet-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet for 32-bit and big-endian targets
        run: |
          for target in linux/386 linux/arm linux/s390x linux/mips; do
            echo "== $target =="
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      # staticcheck and golangci-lint are clean for linux amd64/arm/arm64, the
      # targets that carry an implementation. They are not clean for GOOS=darwin
      # or linux/386, where sctp_linux.go is excluded and the helpers it alone
      # calls are reported unused; that is a property of the build-tag split
      # rather than a defect, so the check names the platform it covers.
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
